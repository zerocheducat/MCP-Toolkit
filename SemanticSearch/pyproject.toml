[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicy-semantic-search"
version = "0.1.0"
description = "Independent EmbeddingGemma 2 hybrid retrieval service for Aicy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "faiss-cpu>=1.8,<2", "mcp==2.2.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
model = ["sentence-transformers>=5.0", "transformers>=5.19"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
semantic-search = "semantic_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
